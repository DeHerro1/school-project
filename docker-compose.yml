# Local Postgres is no longer run here — the project uses Supabase for
# Postgres/Auth/Storage/Realtime. For local dev, run the Supabase CLI's own
# stack instead (it brings its own Postgres, Studio, Storage, Realtime, etc.
# via Docker, and would collide with a `postgres` service on port 5432 here):
#
#   pnpm dlx supabase start   # first time: also run `pnpm dlx supabase init`
#   pnpm dlx supabase stop
#
# This file is kept only as a placeholder in case a plain, Supabase-less
# Postgres is ever needed again for some reason — it defines no services.
services: {}
